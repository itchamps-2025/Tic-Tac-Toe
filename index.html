<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tic Tac Toe</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="game-container">
        <header class="game-header">
            <h1>TIC TAC TOE</h1>
            <p id="gameModeText">Classic 2 Player Game</p>
        </header>

        <section class="mode-selector">
            <button class="mode-button active" id="twoPlayerMode" type="button">2 PLAYERS</button>
            <button class="mode-button" id="computerMode" type="button">PLAY WITH COMPUTER</button>
        </section>

        <section class="score-board">
            <div class="score-card active" id="playerXCard">
                <span class="player-label">PLAYER X</span>
                <span class="score" id="scoreX">0</span>
            </div>

            <div class="score-card" id="playerOCard">
                <span class="player-label" id="playerOLabel">PLAYER O</span>
                <span class="score" id="scoreO">0</span>
            </div>
        </section>

        <div class="game-status" id="gameStatus">Player X's Turn</div>

        <section class="board" id="board" aria-label="Tic tac toe board">
            <button class="cell" data-index="0" aria-label="Cell 1" title="Cell 1"></button>
            <button class="cell" data-index="1" aria-label="Cell 2" title="Cell 2"></button>
            <button class="cell" data-index="2" aria-label="Cell 3" title="Cell 3"></button>
            <button class="cell" data-index="3" aria-label="Cell 4" title="Cell 4"></button>
            <button class="cell" data-index="4" aria-label="Cell 5" title="Cell 5"></button>
            <button class="cell" data-index="5" aria-label="Cell 6" title="Cell 6"></button>
            <button class="cell" data-index="6" aria-label="Cell 7" title="Cell 7"></button>
            <button class="cell" data-index="7" aria-label="Cell 8" title="Cell 8"></button>
            <button class="cell" data-index="8" aria-label="Cell 9" title="Cell 9"></button>
        </section>

        <section class="controls">
            <button class="game-button" id="newRound" type="button">NEW ROUND</button>
            <button class="game-button secondary" id="resetScore" type="button">RESET SCORE</button>
        </section>

        <footer>
            <p id="footerText">Get three symbols in a row to win.</p>
        </footer>
    </main>

    <script src="script.js"></script>
</body>
</html>
